version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: no
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db

volumes:
  mongo_data:
