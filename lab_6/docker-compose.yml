services:
  pg-primary:
    build: .
    container_name: pg-primary
    hostname: pg-primary
    environment:
      - POSTGRES_PASSWORD=postgres
      - ROLE=primary
      - NODE_ID=1
      - NODE_NAME=pg-primary
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    networks:
      - pg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-standby:
    build: .
    container_name: pg-standby
    hostname: pg-standby
    environment:
      - POSTGRES_PASSWORD=postgres
      - ROLE=standby
      - NODE_ID=2
      - NODE_NAME=pg-standby
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
    networks:
      - pg_net
    depends_on:
      pg-primary:
        condition: service_healthy

  pg-witness:
    build: .
    container_name: pg-witness
    hostname: pg-witness
    environment:
      - POSTGRES_PASSWORD=postgres
      - ROLE=witness
      - NODE_ID=3
      - NODE_NAME=pg-witness
    volumes:
      - pg_witness_data:/var/lib/postgresql/data
    networks:
      - pg_net
    depends_on:
      pg-primary:
        condition: service_healthy

  app-client:
    image: postgres:16-alpine
    container_name: app-client
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - pg_net
    depends_on:
      - pg-primary

volumes:
  pg_primary_data:
  pg_standby_data:
  pg_witness_data:

networks:
  pg_net: