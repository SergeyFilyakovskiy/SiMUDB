networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  mongo_data:
  redis_data:


services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: no
    environment:
      MONGO_INITDB_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - ./init/mongo/init-mongo.js:/dokcer-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: no
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - appendonly
      - yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    build: ./app
    restart: no
    env_file:
      - .env
    depends_on:
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
    networks:
      - internal